name: Refresh pack catalog on CDN

# jsDelivr caches `@main` for hours, and raw.githubusercontent.com is often
# unreachable from mainland China, so users can be served a stale pack index.
# Purge the cached index whenever it changes on main.
on:
  push:
    branches: [main]
    paths: [packs/index.json]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache for the pack index
        run: curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/packs/index.json"
